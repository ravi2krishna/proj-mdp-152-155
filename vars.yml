# ansible/inventories/production/group_vars/all.yml
---

### Terraform Outputs ###
# -----------------------
s3_bucket_name: "kopscluster-state-bucket"
vpc_id: "vpc-0c67f9d91b79d8128"
subnet_ids:
  - "subnet-0a046ec5712f890fb"  # AZ: us-east-1a
  - "subnet-00eca3ef82348c623"  # AZ: us-east-1b
  - "subnet-05e81791844e2207b"  # AZ: us-east-1c
kops_role_arn: "arn:aws:iam::390403860578:role/kops-role"
node_role_arn: "arn:aws:iam::390403860578:role/k8s-node-role"


### Cluster Configuration ###
# ---------------------------
cluster_name: "prod-cluster.k8s.local"
k8s_version: "1.28"
aws_region: "us-east-1"

# Zones must match subnet AZs
zones: "us-east-1a,us-east-1b,us-east-1c"

# Node Configuration
master_count: 3
node_count: 3  # One worker per AZ
master_instance_type: "t3.medium"
node_instance_type: "t3.medium"


### IAM Roles ###
# --------------
# Attach IAM roles created by Terraform to nodes
iam:
  master: "{{ kops_role_arn }}"
  node: "{{ node_role_arn }}"


### Networking ###
# ---------------
# Private topology (nodes in private subnets)
topology: "private"
networking: "calico"
associate_public_ip: false


### SSH Access ###
# ---------------
ssh_key_path: "~/.ssh/kops-rsa"  # Path to SSH key (generated by Ansible)


### Tags & Labels ###
# ------------------
cloud_labels:
  Environment: "Prod"
  Project: "MDP-152-155"
